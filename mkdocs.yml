site_name: "Orca"
repo_url: https://github.com/adamkirk/orca/
repo_name: "adamkirk/Orca"

theme:
  name: 'material'
  features:
    - navigation.indexes 
    - content.code.copy
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

use_directory_urls: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - footnotes
  - pymdownx.arithmatex:
      generic: true


extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  
docs_dir: docs

nav:
  - Home: index.md
  - Getting started:
      - getting_started/index.md
      - Choosing a workspace and project: getting_started/context.md
  - Guides:
      - Setting up a workspace: guides/setting_up_a_workspace.md
  - Using orca:
      - usage/index.md
      - Environments: usage/environments.md
      - Workspaces: usage/workspaces.md
      - Extensions & provisioners: usage/extensions_and_provisioners.md
      - Hosts & TLS: usage/hosts_and_tls.md
      - Git: usage/git.md
      - Orca itself: usage/system.md
  - Configuration:
      - configuration/index.md
      - User config: configuration/user_config.md
      - Workspace config: configuration/workspace_config.md
      - Project config: configuration/project_config.md
  - Compose files:
      - compose_files/index.md
      - Overlays:
          - compose_files/overlays/index.md
          - Network & Aliases: compose_files/overlays/network.md
          - TLS Injection: compose_files/overlays/TLS-injection.md
  - Plugins:
      - plugins/index.md
      - Building a plugin: plugins/building.md
      - How plugins work: plugins/how_it_works.md
  # Generated by `orca util gen-docs`, the other command pages are linked from here
  - CLI reference: CLI/orca.md
  - Development guide:
      - development_guide/index.md
      - Release process: development_guide/release_process.md
      - Github Actions: development_guide/github_actions.md

plugins:
  - open-in-new-tab